<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexarc — Ekip Kanalları</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======= GİRİŞ EKRANI ======= -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Nexarc" />
        <span class="brand-name">NEXARC</span>
      </div>
      <h1>Ekip Kanalları</h1>
      <p class="sub">Sesli sohbet, ekran paylaşımı ve mesajlaşma —<br/>3 kişilik ekibiniz için tek yerde.</p>
      <input id="login-name" maxlength="24" placeholder="Takma adın" autocomplete="off" />
      <div class="colors" id="color-picker"></div>
      <div class="theme-row">
        <span class="theme-label">TEMA</span>
        <div class="theme-switch" id="login-theme">
          <button data-theme-opt="acik">Açık</button>
          <button data-theme-opt="koyu">Koyu</button>
          <button data-theme-opt="siyah">Siyah</button>
        </div>
      </div>
      <button id="login-btn" class="primary-btn">Katıl</button>
      <p class="footnote">Mikrofon ve ekran paylaşımı için tarayıcı izni gerekir.</p>
    </div>
  </div>

  <!-- ======= ANA UYGULAMA ======= -->
  <div id="app" class="hidden">
    <!-- Sol: sunucu + kanallar -->
    <aside id="server-sidebar">
      <div class="server-btn" title="Nexarc">
        <img class="server-logo" src="logo.png" alt="Nexarc" />
      </div>
      <div class="sidebar-scroll">
        <div class="channel-group">
          <div class="group-label">METİN KANALLARI</div>
          <div id="text-channels"></div>
        </div>
        <div class="channel-group">
          <div class="group-label">SES KANALLARI</div>
          <div id="voice-channels"></div>
        </div>
      </div>
    </aside>

    <!-- Orta: içerik -->
    <main id="main">
      <header id="topbar">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <button id="mobile-menu-btn" title="Kanallar" aria-label="Kanalları aç">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div id="channel-title">—</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div id="conn"><span id="conn-dot"></span><span id="conn-text">Bağlanıyor…</span></div>
          <button id="theme-btn" title="Tema değiştir">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Metin görünümü -->
      <section id="text-view" class="view hidden">
        <div id="messages"></div>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" placeholder="Mesaj gönder" maxlength="2000" />
          <button type="submit" id="send-btn">Gönder</button>
        </form>
      </section>

      <!-- Ses görünümü -->
      <section id="voice-view" class="view hidden">
        <div id="screen-area" class="hidden"></div>
        <div id="voice-grid"></div>
        <div id="voice-controls">
          <button id="mic-btn" class="ctl" title="Mikrofonu aç/kapat"></button>
          <button id="share-btn" class="ctl" title="Ekran paylaş"></button>
          <button id="leave-btn" class="ctl danger" title="Ses kanalından çık"></button>
        </div>
      </section>
    </main>

    <!-- Sağ: üyeler -->
    <aside id="members-sidebar">
      <div class="group-label" id="members-title">ÜYELER — 0</div>
      <div id="members"></div>
      <div class="ver-tag" title="Uygulama sürümü">Nexarc v2.5</div>
    </aside>
  </div>

  <div id="menu-overlay" class="hidden"></div>
  <div id="screen-lightbox" class="hidden">
    <div class="lightbox-toolbar">
      <span class="lightbox-title">Ekran Paylaşımı</span>
      <div class="lightbox-controls">
        <button id="lb-zoom-out" title="Uzaklaştır">−</button>
        <button id="lb-zoom-reset" title="Sıfırla">⤾</button>
        <button id="lb-zoom-in" title="Yakınlaştır">+</button>
        <button id="lb-close" title="Kapat">✕</button>
      </div>
    </div>
    <div class="lightbox-stage"><video id="lightbox-video" autoplay playsinline muted></video></div>
  </div>

  <div id="toast-wrap"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
